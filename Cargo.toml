[workspace]
resolver = "3"
members = ["crates/*", "tests/integration"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
authors = ["Denys Zhodik"]
license = "MIT"
repository = "https://github.com/ysz7/Argus"
publish = false

[workspace.dependencies]
# Internal crates
argus-protocol = { path = "crates/argus-protocol" }
argus-capture = { path = "crates/argus-capture" }
argus-accessibility = { path = "crates/argus-accessibility" }
argus-perception = { path = "crates/argus-perception" }
argus-fusion = { path = "crates/argus-fusion" }
argus-tracking = { path = "crates/argus-tracking" }
argus-core = { path = "crates/argus-core" }
argus-server = { path = "crates/argus-server" }
argus-benchmark = { path = "crates/argus-benchmark" }
argus-input = { path = "crates/argus-input" }
argus-mcp = { path = "crates/argus-mcp" }

# External crates
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
unicode-normalization = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Test-only
assert_cmd = "2"
predicates = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
